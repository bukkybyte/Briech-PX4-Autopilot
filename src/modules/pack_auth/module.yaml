module_name: Battery pack authentication
parameters:
- group: Pack Authentication
  definitions:
    PKA_BUS:
      description:
        short: Pack authenticator I2C bus
        long: |
          I2C bus (as numbered by PX4, from 1) the battery packs are connected to.
          -1 scans every external I2C bus for each pack.
      type: int32
      default: -1
      min: -1
      max: 4
      reboot_required: true
    PKA_ADDR:
      description:
        short: First pack authenticator I2C address
        long: |
          I2C address of pack 1. Pack N is at PKA_ADDR + N - 1, so the packs need consecutive
          addresses. Default 11 (0x0B).
      type: int32
      default: 11
      min: 8
      max: 119
      reboot_required: true
    PKA_NUM:
      description:
        short: Number of packs that must authenticate
        long: |
          Arming is refused unless every one of these packs has proven its identity.
          In a signed build this value only counts together with a valid PKA_S0..PKA_S3.
      type: int32
      default: 1
      min: 1
      max: 5
      reboot_required: true
    PKA_S0:
      description:
        short: Pack count signature word 0
        long: |
          Part of the signature that binds PKA_NUM to this autopilot. Generated by
          tools/sign_config.py, not set by hand.
      type: int32
      default: 0
      min: 0
      max: 65535
    PKA_S1:
      description:
        short: Pack count signature word 1
        long: See PKA_S0.
      type: int32
      default: 0
      min: 0
      max: 65535
    PKA_S2:
      description:
        short: Pack count signature word 2
        long: See PKA_S0.
      type: int32
      default: 0
      min: 0
      max: 65535
    PKA_S3:
      description:
        short: Pack count signature word 3
        long: See PKA_S0.
      type: int32
      default: 0
      min: 0
      max: 65535
